name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mínimo privilegio: cada job pide solo lo que necesita por encima de esto.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build y tests
        run: ./mvnw -B verify
      - name: Reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: warn

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: SpotBugs + Find Security Bugs sobre secure/ y common/
        run: ./mvnw -B compile spotbugs:check
      - name: Reporte SAST
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spotbugs-report
          path: |
            target/spotbugsXml.xml
            target/spotbugsSarif.json
          if-no-files-found: warn
      - name: Subir SARIF al tab Security
        if: always() && hashFiles('target/spotbugsSarif.json') != ''
        # El gate es el paso de SpotBugs. Una falla al publicar (repo privado sin code scanning, PR de un fork) no debe
        # confundirse con un hallazgo.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: target/spotbugsSarif.json
          category: spotbugs

  sast-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # spotbugs:spotbugs solo genera el reporte y no corta el build: quien decide es el paso siguiente.
      - name: Mismo análisis, incluyendo vulnerable/
        run: ./mvnw -B -Psast-proof compile spotbugs:spotbugs
      - name: Exigir que se haya detectado la SQL injection de vulnerable/
        run: |
          # Se busca dentro de <BugInstance>: la tabla <BugPattern> del mismo XML también repite el tipo.
          if ! grep -qE "<BugInstance [^>]*type='SQL_INJECTION[A-Z_]*'" target/spotbugsXml.xml; then
            echo "::error::SpotBugs no detectó la SQL injection de vulnerable/: el gate sast no es confiable"
            exit 1
          fi
          echo "Hallazgos por tipo:"
          grep -oE "<BugInstance [^>]*>" target/spotbugsXml.xml | grep -oE " type='[A-Z_0-9]+'" | sort | uniq -c
      - name: Reporte de la prueba
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spotbugs-proof-report
          path: target/spotbugsXml.xml
          if-no-files-found: warn

  # Actualiza la base una sola vez por día y la comparte con sca y sca-proof. Si cada job la actualizara por su cuenta,
  # correrían en paralelo contra los rate limits de NVD.
  nvd-db:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - id: key
        run: echo "value=dependency-check-db-$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: ${{ steps.key.outputs.value }}
          restore-keys: dependency-check-db-
      - name: Actualizar la base de NVD
        if: steps.restore.outputs.cache-hit != 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # Con la variable vacía Dependency-Check aborta con un "Invalid API Key" poco claro.
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Falta el secret NVD_API_KEY (en PRs de Dependabot, cargarlo también en los secrets de Dependabot)"
            exit 1
          fi
          ./mvnw -B dependency-check:update-only
      - name: Guardar la base
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: ${{ steps.key.outputs.value }}

  sca:
    needs: nvd-db
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: ${{ needs.nvd-db.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Dependency-Check sobre las dependencias reales (corta con CVSS >= 7)
        run: ./mvnw -B dependency-check:check -DautoUpdate=false
      - name: Reporte SCA
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.sarif
            target/dependency-check-report.json
          if-no-files-found: warn
      - name: Subir SARIF al tab Security
        if: always() && hashFiles('target/dependency-check-report.sarif') != ''
        # El gate es el paso de Dependency-Check: una falla al publicar no debe confundirse con un hallazgo.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: target/dependency-check-report.sarif
          category: dependency-check

  sca-proof:
    needs: nvd-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: ${{ needs.nvd-db.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Dependency-Check con la dependencia vulnerable
        run: |
          # El build TIENE que fallar. Pero un simple "falló, entonces verde" también daría verde ante una caída de la
          # red o un error de configuración, así que después se comprueba el motivo de la falla.
          status=0
          # Con redirección y no con "| tee": sin pipefail, $? sería el de tee y no el de Maven.
          ./mvnw -B -Pvulnerable-deps dependency-check:check -DautoUpdate=false > dependency-check.log 2>&1 || status=$?
          cat dependency-check.log
          if [ "$status" -eq 0 ]; then
            echo "::error::Dependency-Check no cortó el build: el gate sca no es confiable"
            exit 1
          fi
          if ! grep -q "CVSS score greater than or equal to" dependency-check.log; then
            echo "::error::El build falló por otro motivo, no por el umbral de CVSS"
            exit 1
          fi
          if ! jq -e '[.dependencies[] | select(.fileName | startswith("log4j-1.2.17")) | .vulnerabilities[]?] | length > 0' \
              target/dependency-check-report.json > /dev/null; then
            echo "::error::El reporte no atribuye ninguna CVE a log4j-1.2.17"
            exit 1
          fi
          echo "Dependency-Check cortó el build por log4j-1.2.17, como se esperaba"
      - name: Reporte de la prueba
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-proof-report
          path: target/dependency-check-report.html
          if-no-files-found: warn

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo: un secreto borrado en un commit posterior sigue siendo un secreto filtrado.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comentar en el PR exigiría pull-requests: write. El hallazgo ya se ve en el job.
          GITLEAKS_ENABLE_COMMENTS: 'false'

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Generar SBOM CycloneDX
        run: ./mvnw -B cyclonedx:makeBom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: target/bom.json
          if-no-files-found: error
