name: DAST

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build del jar
        run: ./mvnw -B -DskipTests package
      - name: Levantar la app con el perfil default y esperar a que esté UP
        run: |
          nohup java -jar target/spring-owasp-lab-*.jar > app.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::La app no llegó a UP"
          cat app.log
          exit 1
      - name: Autenticar el escaneo
        # Sin credenciales ZAP solo vería respuestas 401. Son las credenciales públicas del usuario semilla del lab.
        run: echo "ZAP_AUTH_HEADER_VALUE=Basic $(printf 'bob:bob-lab-pass' | base64)" >> "$GITHUB_ENV"
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_SITE: localhost
        with:
          target: http://localhost:8080/secure/orders/search?product=Keyboard
          rules_file_name: config/zap-rules.tsv
          # La action solo falla con fail_action: true, pero así también fallaría por cualquier WARN. Con -I solo cortan
          # las reglas marcadas como FAIL en zap-rules.tsv.
          fail_action: true
          cmd_options: -I
          # Crear issues exigiría issues: write. El reporte queda como artifact.
          allow_issue_writing: false
          artifact_name: zap-report
      - name: Log de la app
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-log
          path: app.log
          if-no-files-found: warn
