name: Nightly SCA

# Aparecen CVEs nuevas aunque nadie toque el código: este workflow detecta las que no vería ci.yml sin un push.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Siempre main, también si se lanza a mano desde otra rama.
          ref: main
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - id: key
        run: echo "value=dependency-check-db-$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: ${{ steps.key.outputs.value }}
          restore-keys: dependency-check-db-
      - name: Dependency-Check con la base actualizada (corta con CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Falta el secret NVD_API_KEY"
            exit 1
          fi
          ./mvnw -B dependency-check:check
      # También cuando el gate falla: la base ya se actualizó y no conviene volver a descargarla.
      - name: Guardar la base
        if: always() && steps.restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: ${{ steps.key.outputs.value }}
      - name: Reporte SCA
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-nightly-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.sarif
          if-no-files-found: warn
      - name: Subir SARIF al tab Security
        if: always() && hashFiles('target/dependency-check-report.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: target/dependency-check-report.sarif
          category: dependency-check
