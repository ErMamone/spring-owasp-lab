# A02 Security Misconfiguration. INSEGURO a propósito: nada de esto debe activarse fuera de la demo y los tests.
spring:
  web:
    error:
      # El cliente recibe stacktrace y mensaje interno en cada error.
      include-stacktrace: always
      include-message: always

management:
  endpoints:
    web:
      exposure:
        # env, beans, mappings, heapdump, etc. quedan publicados. InsecureActuatorConfig además les quita la autenticación.
        include: "*"
